<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | PORTFOLIO</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/contact.css" />
  </head>
  <body>
    <!-- header section -->
    <header>
      <div class="main-nav">
        <!-- web logo -->
        <div class="logo">
          <h1>UltimateFolio</h1>
        </div>

        <!-- navigation list -->
        <nav>
          <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./projects.html">Projects</a></li>
            <li><a href="./blog.html">Blog</a></li>
            <li><a href="./contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main-body">
      <section class="contact">
        <div class="contact-header">

          <h1 class="title">Get In Touch</h1>
          <p>
            Have a project in mind? Fill in the form and I will get back to you.
          </p>
        </div>
        <form action="">
          <div class="input-group">
            <label for="name">Full Name <span>*</span></label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="e.g Elijah Mike"
              required
            />
          </div>
          <div class="input-group">
            <label for="email">Email Address <span>*</span></label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="input-group">
            <label for="service">Service Needed <span>*</span></label>
            <select name="service" id="service" required>
              <option value="">-- choose a servce --</option>
              <option value="web-app">Web Application</option>
              <option value="web-design">Web Design</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="input-group">
            <label for="messsage">Message <span>*</span></label>
            <textarea
              name="messsage"
              id="messsage"
              placeholder="Tell me about your project..."
              required
            ></textarea>
          </div>

          <div class="cta">
            <button class="btn" type="submit">Send Message</button>
          </div>
        </form>
      </section>
    </main>


    <!-- footer content -->
   
    <footer>
      <div>
        <p>

          <li><a href="https://github.com/ultimatefaloe" target="_blank">GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/tunmise-falodun-1894b22a2" target="_blank">LinkedIn</a></li>
          <li><a href="mailto:ultimatefaloe@outlook.com" target="_blank">Email</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
